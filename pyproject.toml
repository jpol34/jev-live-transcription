[project]
name = "jev-live-transcription"
version = "0.1.0"
description = "Benchmark comparing GLiNER+jev field extraction against GPT-5.1 on live call transcripts"
requires-python = ">=3.11"
dependencies = [
    "openai",
    "typesafe-sdk",
    "gliner>=0.2.29",
    "torch",
    "rich",
    "pytest",
    "protobuf>=7.36.2",
    "pytest-asyncio",
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "aiohttp",
    "hangar @ git+https://github.com/jpol34/hangar",
]

[project.scripts]
jlt = "jev_live_transcription.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/jev_live_transcription"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
